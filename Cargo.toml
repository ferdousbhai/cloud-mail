[workspace]
resolver = "3"
members = ["crates/cloudmail-api", "crates/cloudmail", "crates/cloudmail-gtk"]

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/ferdousbhai/cloud-mail"

[workspace.dependencies]
cloudmail-api = { path = "crates/cloudmail-api" }
chrono = "0.4.45"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }
urlencoding = "2.1.3"
base64 = "0.23.1"

[profile.release]
lto = "thin"
strip = true
