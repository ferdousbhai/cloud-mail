name: Check
# Every check a change must pass, on every push: bin/check, which is rustfmt, clippy and the tests of the library,
# the CLI and the desktop app, the app's scripted QA on a hidden display (any GLib warning fails it), the worker's
# tests and the packaging tests. The same script runs on the machine a branch is pushed from (.githooks/pre-push);
# this run is the one that does not depend on that machine, or on the hook being enabled there. Arch Linux, as the
# release packages are built on (bin/build-package), for its GTK 4 and WebKitGTK 6.0.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: archlinux:base-devel
    env:
      CARGO_HOME: /cargo
    steps:
      # gtk4 has the broadway display the QA runs on; dbus is the CLI tests' private session bus; a font, because
      # the image has none and GTK warns when it has nothing to draw text with, which fails the QA; nodejs for the
      # worker's cf CLI, which will not load cloudflare.config.ts under Bun.
      - name: Install what the checks need
        run: |
          sed -i "/^\[options\]$/a DisableSandbox" /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --needed --noconfirm base-devel rust git gtk4 webkitgtk-6.0 dbus python bun nodejs ttf-dejavu
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /cargo/registry
            /cargo/git
            target
          key: check-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            check-
      # The checks run as an ordinary user, as they do on a desk: WebKit's sandbox does not start as root. Nor does it
      # start in a container under Docker's seccomp profile, which refuses bubblewrap the user namespaces it is built
      # on, so here alone the web views run unsandboxed. They show only the stand-in worker's made-up mail, with
      # remote content blocked, and the container is thrown away after the run.
      - name: Run every check
        run: |
          useradd -m checker
          mkdir -p /cargo target
          chown -R checker: . /cargo
          su checker -c 'git config --global --add safe.directory "$PWD" && WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 CARGO_HOME=/cargo bin/check'
