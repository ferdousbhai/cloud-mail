name: Verify published release
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Prepare native Arch Linux ARM image
        if: matrix.arch == 'aarch64'
        run: |
          curl --fail --location --retry 3 https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o /tmp/archlinuxarm.tar.gz
          docker import /tmp/archlinuxarm.tar.gz cloudmail-archlinuxarm:ci
      - name: Verify the triggering release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARM_BUILD_IMAGE: cloudmail-archlinuxarm:ci
        run: bin/verify-release "${RELEASE_TAG#v}" '${{ matrix.arch }}'
