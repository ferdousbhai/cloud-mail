[package]
name = "cloudmail-api"
description = "API client, types and config for cloudmail"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
urlencoding.workspace = true
base64.workspace = true
imap-proto = { version = "0.17", default-features = false }
mail-parser = { version = "0.11", default-features = false, features = ["full_encoding"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "rustls", "ring", "webpki-roots", "hostname"] }
nom = { version = "8", default-features = false }
webpki-roots = { version = "1", default-features = false }
