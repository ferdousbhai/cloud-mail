[package]
name = "cloudmail"
description = "Command-line client for cloudmail, built for people and agents"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "cloudmail"
path = "src/main.rs"

[dependencies]
cloudmail-api.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true
dirs.workspace = true
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
