[package]
name = "cloudmail-gtk"
description = "Native GTK4 client for cloudmail"
version.workspace = true
edition.workspace = true
rust-version = "1.95"  # if-let guards (1.95); gtk4-rs 0.11 and its glib/cairo/gdk crates require 1.92
license.workspace = true

[dependencies]
cloudmail-api.workspace = true
serde_json.workspace = true
dirs.workspace = true
urlencoding.workspace = true
gtk = { version = "0.11", package = "gtk4", features = ["v4_16"] }
omui = { git = "https://github.com/ferdousbhai/omui", rev = "2d34cf50a29a8ad5338d94d4d9e46c1587f7ef40" } # v0.4.0
webkit6 = "0.6"
ammonia = "4.2.0"
